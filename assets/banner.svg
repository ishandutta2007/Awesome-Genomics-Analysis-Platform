<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgb(20,20,50);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgb(30,90,150);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(10,200,200);stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="200" fill="url(#grad1)" rx="15"/>
  
  <path d="M 100 100 Q 150 50 200 100 T 300 100 T 400 100 T 500 100 T 600 100 T 700 100" stroke="rgba(255,255,255,0.2)" stroke-width="3" fill="transparent">
    <animate attributeName="d" 
             values="M 100 100 Q 150 50 200 100 T 300 100 T 400 100 T 500 100 T 600 100 T 700 100;
                     M 100 100 Q 150 150 200 100 T 300 100 T 400 100 T 500 100 T 600 100 T 700 100;
                     M 100 100 Q 150 50 200 100 T 300 100 T 400 100 T 500 100 T 600 100 T 700 100" 
             dur="4s" repeatCount="indefinite" />
  </path>
  
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="white" font-weight="bold" filter="url(#glow)">Awesome Genomics Platforms</text>
  <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e0e0e0">Analysis, Variant Calling, &amp; Clinical Interpretation</text>
  
  <circle cx="150" cy="100" r="4" fill="white">
    <animate attributeName="cy" values="90;110;90" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="100" r="4" fill="white">
    <animate attributeName="cy" values="110;90;110" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
